<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Process ↔ Signal Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #0a0a0a;
  color: #eeeeee;
  text-align: center;
  padding: 20px;
}
.box {
  background: #1a1a1a;
  padding: 30px;
  border-radius: 12px;
  max-width: 440px;
  margin: auto;
  border: 1px solid #333;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
h2 { color: #fff; margin-bottom: 25px; }
h3 {
  font-size: 14px; color: #888; text-transform: uppercase;
  margin-top: 20px; border-bottom: 1px solid #333; padding-bottom: 5px;
  text-align: left; width: 90%; margin: auto;
}
input {
  width: 90%; padding: 12px; margin: 8px 0;
  border-radius: 6px; border: 1px solid #444;
  background: #222; color: #fff;
}
button {
  padding: 12px;
  border-radius: 6px; border: 1px solid #555;
  cursor: pointer; background: #333; color: #fff;
  font-weight: 600;
}
.button-row {
  display: flex;
  gap: 10px;
  width: 90%;
  margin: 10px auto;
}
.button-row button {
  flex: 1;
  margin: 0;
}
.result-label {
  font-size: 14px;
  color: #888;
  text-transform: uppercase;
  margin-top: 20px;
  text-align: left;
  width: 90%;
  margin-left: auto;
  margin-right: auto;
  padding-bottom: 5px;
  border-bottom: 1px solid #333;
}
.result {
  font-size: 20px; margin-top: 10px; padding: 15px;
  background: #111; border-radius: 8px; color: #fff;
  border: 1px solid #333;
  width: 90%;
  margin-left: auto;
  margin-right: auto;
  box-sizing: border-box;
}
@media (max-width: 480px) {
  .button-row {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="box">
<h2>Process ↔ Signal</h2>

<h3>Process Scale</h3>
<input id="procMin" type="number" placeholder="Min" value="0">
<input id="procMax" type="number" placeholder="Max" value="100">

<h3>Signal Scale</h3>
<input id="sigMin" type="number" placeholder="Min" value="4">
<input id="sigMax" type="number" placeholder="Max" value="20">

<h3>Value</h3>
<input id="valueInput" type="number" placeholder="Enter value to convert">

<div class="button-row">
  <button onclick="processToSignal()">Convert to Signal</button>
  <button onclick="signalToProcess()">Convert to Process</button>
</div>

<div class="result-label">Result</div>
<div class="result" id="output">Ready to convert</div>
</div>

<script>
function getScale() {
  return {
    pMin: parseFloat(document.getElementById("procMin").value),
    pMax: parseFloat(document.getElementById("procMax").value),
    sMin: parseFloat(document.getElementById("sigMin").value),
    sMax: parseFloat(document.getElementById("sigMax").value)
  };
}

function getValue() {
  return parseFloat(document.getElementById("valueInput").value);
}

function processToSignal() {
  const s = getScale();
  const p = getValue();
  if (isNaN(p)) return;
  const signal = s.sMin + (p - s.pMin)*(s.sMax - s.sMin)/(s.pMax - s.pMin);
  document.getElementById("output").innerText = signal.toFixed(3);
}

function signalToProcess() {
  const s = getScale();
  const sig = getValue();
  if (isNaN(sig)) return;
  const process = s.pMin + (sig - s.sMin)*(s.pMax - s.pMin)/(s.sMax - s.sMin);
  document.getElementById("output").innerText = process.toFixed(3);
}
</script>

</body>
</html>
